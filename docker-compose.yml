# garcias-home: servidor da casa (Raspberry Pi 4), proxy de entrada na porta 80.
# Cada aplicação roda no próprio repositório/compose, escutando só em 127.0.0.1; o Caddy as publica por nome.
services:
  caddy:
    image: caddy:2-alpine
    container_name: garcias-home-caddy
    restart: unless-stopped
    # Rede do host: alcança as aplicações em 127.0.0.1 sem publicar as portas delas na rede.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./casa:/srv/casa:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - TZ=America/Sao_Paulo

  # API da rotina: guarda por dia o que foi feito e os comentários (dados/rotina/AAAA-MM-DD.json).
  rotina-api:
    image: python:3.12-alpine
    container_name: garcias-home-rotina
    restart: unless-stopped
    network_mode: host
    # Mesmo usuário do dono do repositório, para os arquivos de dados continuarem editáveis fora do container.
    user: "${CASA_UID:-1000}:${CASA_GID:-1000}"
    command: ["python", "/app/rotina.py"]
    volumes:
      - ./api:/app:ro
      - ./dados:/dados
    environment:
      - DADOS_DIR=/dados/rotina
      - PORT=8081
      - BIND=127.0.0.1
      - TZ=America/Sao_Paulo

volumes:
  caddy-data:
  caddy-config:
