<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servidor da casa</title>
  <style>
    :root {
      --bg: #f4f6f9; --card: #ffffff; --line: #dde3ec; --text: #16233a; --muted: #5b6a82; --accent: #16305e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0c1422; --card: #131e31; --line: #22314b; --text: #e7edf6; --muted: #9aa9c1; --accent: #8fb4ff; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 48px 16px; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.01em; }
    p.sub { margin: 0 0 32px; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.app {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none;
    }
    a.app:hover, a.app:focus-visible { border-color: var(--accent); outline: none; }
    .name { font-weight: 700; font-size: 18px; }
    .desc { color: var(--muted); font-size: 14px; }
    .host { color: var(--accent); font-size: 14px; font-weight: 600; white-space: nowrap; }
    @media (max-width: 520px) { a.app { flex-direction: column; align-items: flex-start; gap: 4px; } }
  </style>
</head>
<body>
  <main>
    <h1>Servidor da casa</h1>
    <p class="sub">Aplicações disponíveis na rede local.</p>
    <!-- Ao publicar uma aplicação nova no Caddyfile, acrescente um item aqui. -->
    <ul>
      <li>
        <a class="app" href="http://view.blizzard.net/">
          <span><span class="name">Blizzard</span><br><span class="desc">Central de monitoramento: câmeras e Home Assistant</span></span>
          <span class="host">view.blizzard.net</span>
        </a>
      </li>
      <li>
        <a class="app" href="http://rotina.blizzard.net/">
          <span><span class="name">Rotina da Ana Liz</span><br><span class="desc">Rotina semanal, de segunda a domingo</span></span>
          <span class="host">rotina.blizzard.net</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
