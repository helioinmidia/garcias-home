<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rotina">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FBF6EE">
  <link rel="apple-touch-icon" href="/rotina/icon.png">
  <link rel="icon" href="/rotina/icon.png">
  <link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="rotina.css">
  <title>Rotina da Ana Liz</title>
</head>
<body>
  <header class="topo" id="topo">
    <div class="topo-in">
      <div>
        <p class="eyebrow" id="eyebrow">Rotina da Ana Liz</p>
        <div class="dia">
          <h1 id="dia-nome">&nbsp;</h1>
          <div class="nav">
            <button type="button" id="dia-anterior" aria-label="Dia anterior">‹</button>
            <button type="button" id="dia-seguinte" aria-label="Dia seguinte">›</button>
            <button type="button" class="hoje" id="dia-hoje" hidden>Hoje</button>
          </div>
        </div>
        <p class="data" id="dia-data"></p>
      </div>
      <div class="relogio">
        <div class="hora" id="hora" aria-live="off">--:--</div>
        <p class="agora-txt" id="agora-txt"></p>
      </div>
      <div class="progresso" id="progresso">
        <div class="contagem" id="contagem"><span>0</span> de 0 feitas</div>
        <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barra"><i></i></div>
        <div class="pct" id="pct">0%</div>
        <p class="parabens" id="parabens" hidden>Tudo feito! Parabéns, Ana Liz.</p>
      </div>
    </div>
  </header>

  <main id="lista">
    <p class="carregando">Carregando a rotina…</p>
  </main>

  <div class="conteudo">
    <footer class="rodape">
      <div class="quem" id="legenda"></div>
      <span><a href="/">← Casa</a> · <a href="cartaz.html">Versão para imprimir</a></span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="app.js" defer></script>
</body>
</html>
