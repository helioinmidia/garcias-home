    (function () {
      var last = null;
      function check() {
        fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
          if (!r.ok) return;
          var tag = r.headers.get('ETag') || r.headers.get('Last-Modified');
          if (!tag) return;
          if (last && tag !== last) location.reload();
          last = tag;

      check();
      setInterval(check, 5 * 60 * 1000);

      // as real-vs-'null' rather than matching.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    body { margin: 0; font-family: 'Nunito', 'Trebuchet MS', sans-serif; background: #FBF6EE; color: #2B2A28; }\n    a { color: #B5532B; } a:hover { color: #8F3F1F; }\n    .row { display: grid; grid-template-columns: 96px 1fr 300px; gap: 20px; align-items: start; padding: 16px 0; border-top: 1px dashed #D9CFC0; }\n    .row:first-child { border-top: none; }\n    .time { font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 800; color: #2B2A28; padding-top: 2px; }\n    .act { font-size: 18px; font-weight: 800; margin: 0 0 4px 0; }\n    .desc { font-size: 15px; font-weight: 500; line-height: 1.4; color: #4A4744; margin: 0; }\n    .who { display: flex; flex-wrap: wrap; gap: 6px; }\n    .chip { font-size: 13px; font-weight: 800; padding: 6px 12px; border-radius: 999px; border: 2px solid transparent; line-height: 1; white-space: nowrap; }\n    .c-kid { background: #F2C94C; border-color: #F2C94C; color: #3A2E00; }\n    .c-mae { background: #F0A3B5; border-color: #F0A3B5; color: #4A1524; }\n    .c-pai { background: #9CC7E8; border-color: #9CC7E8; color: #0F3350; }\n    .c-esc { background: #C9C3B8; border-color: #C9C3B8; color: #2B2A28; }\n    .c-mst { background: #A8D5B0; border-color: #A8D5B0; color: #10391A; }\n    .c-fam { background: #D9A5E0; border-color: #D9A5E0; color: #3E1247; }\n    .opt { background: transparent !important; }\n    .opt.c-kid { color: #8A6A00; } .opt.c-mae { color: #B04A66; } .opt.c-pai { color: #2C6A9E; }\n    .opt.c-esc { color: #5E5A54; } .opt.c-mst { color: #2E7A3D; } .opt.c-fam { color: #8A3E96; }\n    .block { background: #FFFFFF; border: 2px solid #E8DFCF; border-radius: 20px; padding: 24px 28px; break-inside: avoid; page-break-inside: avoid; }\n    .row, .day { break-inside: avoid; page-break-inside: avoid; }\n    @media print {\n      .block, .day { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n      .chip { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n    }\n    .bt { font-family: 'Fraunces', Georgia, serif; font-size: 30px; font-weight: 800; margin: 0 0 4px 0; }\n    .bs { font-size: 14px; font-weight: 700; color: #6E6963; margin: 0 0 12px 0; letter-spacing: 0.04em; text-transform: uppercase; }\n    .day { background: #FFFFFF; border: 2px solid #E8DFCF; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }\n    .dn { font-family: 'Fraunces', Georgia, serif; font-size: 20px; font-weight: 800; margin: 0; }\n    .dl { font-size: 14px; font-weight: 700; margin: 0; }\n    .dd { font-size: 13px; font-weight: 500; color: #4A4744; margin: 0; line-height: 1.35; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: 1240px; height: 2280px; box-sizing: border-box; padding: 56px 64px; display: flex; flex-direction: column; gap: 28px;\">\n\n  <!-- Cabeçalho -->\n  <div style=\"display: flex; justify-content: space-between; align-items: flex-end; gap: 32px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n      <p style=\"margin: 0; font-size: 14px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}};\">Rotina semanal da Ana Liz · 7 anos · escola à tarde<\u002Fp>\n      <h1 style=\"margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 52px; font-weight: 800; line-height: 1.05;\">Manhãs de descoberta,<br>noites em família<\u002Fh1>\n      <p style=\"margin: 6px 0 0 0; font-size: 16px; font-weight: 500; color: #4A4744; max-width: 620px; line-height: 1.4;\">Ana Liz, esta é a sua rotina. De manhã você faz as tarefas, desenha, estuda inglês no Duolingo e aprende coisas novas com a mamãe e o papai. Siga os horários com atenção: cumprindo tudo direitinho, sobra tempo para brincar.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border: 2px solid #E8DFCF; border-radius: 16px; padding: 16px 20px; min-width: 330px;\">\n      <p style=\"margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #6E6963;\">Quem participa<\u002Fp>\n      <div class=\"who\">\n        \n        <span class=\"chip c-mae\">Mãe<\u002Fspan>\n        <span class=\"chip c-pai\">Pai<\u002Fspan>\n        <span class=\"chip c-fam\">Família toda<\u002Fspan>\n        <span class=\"chip c-esc\">Escola<\u002Fspan>\n        <span class=\"chip c-mst\">Mestre de taekwondo<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 14px; align-items: center; margin-top: 4px;\">\n        <span class=\"chip c-pai\">Deve estar<\u002Fspan>\n        <span class=\"chip c-pai opt\">Pode estar<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Manhã -->\n  <div class=\"block\">\n    <p class=\"bs\">Segunda a sexta<\u002Fp>\n    <h2 class=\"bt\" style=\"color: {{accent}};\">Manhã · o melhor horário do dia<\u002Fh2>\n    <div style=\"display: flex; flex-direction: column;\">\n      <div class=\"row\">\n        <div class=\"time\">09:00<\u002Fdiv>\n        <div><p class=\"act\">A persiana abriu: acorde<\u002Fp><p class=\"desc\">Deixe a luz do sol ser seu despertador. Espreguice uns minutos na cama, ganhe um abraço e comece o dia devagar.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">09:05<\u002Fdiv>\n        <div><p class=\"act\">Arrume a cama<\u002Fp><p class=\"desc\">Estique o lençol, ajeite o travesseiro e guarde o pijama.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">09:10<\u002Fdiv>\n        <div><p class=\"act\">Vá ao banheiro, lave o rosto e escove os dentes<\u002Fp><p class=\"desc\">Escove os dentes por dois minutos (cante uma música para marcar o tempo), troque de roupa e penteie o cabelo.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">09:25<\u002Fdiv>\n        <div><p class=\"act\">Desça para o café da manhã<\u002Fp><p class=\"desc\">Ajude a pôr a mesa e tome café com a mamãe e o papai. Converse com eles e veja qual é o projeto da manhã de hoje.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><span class=\"chip c-mae\">Mãe<\u002Fspan><span class=\"chip c-pai\">Pai<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">09:40<\u002Fdiv>\n        <div><p class=\"act\">Faça a lição de inglês no Duolingo (20 min)<\u002Fp><p class=\"desc\">Faça a lição de inglês do dia, mantenha sua sequência e depois guarde o aparelho.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">10:00<\u002Fdiv>\n        <div><p class=\"act\">Faça as tarefas da escola (20 min)<\u002Fp><p class=\"desc\">Olhe a agenda, faça a lição de casa e separe o material do dia. Fazendo de manhã, a noite fica livre para descansar. Se tiver dúvida, chame a mamãe ou o papai.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><span class=\"chip c-pai\">Pai<\u002Fspan><span class=\"chip c-mae opt\">Mãe<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">10:20<\u002Fdiv>\n        <div><p class=\"act\">Faça o projeto da manhã (40 min)<\u002Fp><p class=\"desc\">Cada dia um projeto diferente: desenho, inglês no Duolingo, investigação ou quadrinhos. Aprenda junto com a mamãe ou o papai. Veja as ideias de cada dia na página de projetos.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><span class=\"chip c-mae\">Mãe<\u002Fspan><span class=\"chip c-pai opt\">Pai<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">11:00<\u002Fdiv>\n        <div><p class=\"act\">Mexa o corpo<\u002Fp><p class=\"desc\">Ande de bicicleta, brinque no quintal, pule corda ou caminhe (25 min). Gaste energia agora para prestar atenção na escola.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">11:25<\u002Fdiv>\n        <div><p class=\"act\">Brinque, leia ou desenhe<\u002Fp><p class=\"desc\">Brinque, leia um livro ou desenhe no seu caderno.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">11:50<\u002Fdiv>\n        <div><p class=\"act\">Tome banho e arrume-se para a escola<\u002Fp><p class=\"desc\">Tome banho, vista o uniforme que você separou ontem à noite, penteie o cabelo e calce o tênis.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">12:10<\u002Fdiv>\n        <div><p class=\"act\">Almoce<\u002Fp><p class=\"desc\">Almoce com calma, já arrumada para a escola (use um guardanapo grande para proteger o uniforme). Ajude a pôr a mesa e tire o seu prato.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><span class=\"chip c-mae\">Mãe<\u002Fspan><span class=\"chip c-pai opt\">Pai<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">12:40<\u002Fdiv>\n        <div><p class=\"act\">Escove os dentes e feche a mochila<\u002Fp><p class=\"desc\">Escove os dentes, feche a mochila (a tarefa já está pronta) e coloque seu caderninho de desenho dentro. Esteja pronta às 12:50.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Tarde -->\n  <div class=\"block\">\n    <p class=\"bs\">Segunda a sexta<\u002Fp>\n    <h2 class=\"bt\" style=\"color: {{accent}};\">Tarde · escola<\u002Fh2>\n    <div style=\"display: flex; flex-direction: column;\">\n      <div class=\"row\">\n        <div class=\"time\">12:50<\u002Fdiv>\n        <div><p class=\"act\">Vá para a escola<\u002Fp><p class=\"desc\">Vá com a mamãe ou o papai e converse no caminho.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><span class=\"chip c-mae\">Mãe<\u002Fspan><span class=\"chip c-pai opt\">Pai<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">13:00<br><span style=\"font-size: 14px; font-weight: 700; color: #6E6963;\">até 17:30<\u002Fspan><\u002Fdiv>\n        <div><p class=\"act\">Escola<\u002Fp><p class=\"desc\">Aproveite para ver os amigos e aprender coisas novas.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><span class=\"chip c-esc\">Escola<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Noite -->\n  <div class=\"block\">\n    <p class=\"bs\">Segunda a sexta<\u002Fp>\n    <h2 class=\"bt\" style=\"color: {{accent}};\">Fim de tarde e noite · em família<\u002Fh2>\n    <div style=\"display: flex; flex-direction: column;\">\n      <div class=\"row\">\n        <div class=\"time\">18:00<\u002Fdiv>\n        <div><p class=\"act\">Chegue, lanche e descanse<\u002Fp><p class=\"desc\">Faça um lanche e aproveite meia hora com a mamãe ou o papai. Conte como foi o seu dia.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><span class=\"chip c-mae\">Mãe<\u002Fspan><span class=\"chip c-pai opt\">Pai<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">18:30<\u002Fdiv>\n        <div><p class=\"act\">Brinque ao ar livre ou jogue<\u002Fp><p class=\"desc\">Vá à praça, ande de bicicleta, jogue em família ou desenhe enquanto o jantar fica pronto. Segunda e quarta, vista o dobok e prepare-se para sair.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><span class=\"chip c-pai\">Pai<\u002Fspan><span class=\"chip c-mae opt\">Mãe<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">19:00<br><span style=\"font-size: 14px; font-weight: 700; color: #6E6963;\">seg · qua<\u002Fspan><\u002Fdiv>\n        <div><p class=\"act\">Vá ao taekwondo<\u002Fp><p class=\"desc\">Treine com vontade! A mamãe ou o papai leva você e, quando der, fica assistindo.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><span class=\"chip c-mst\">Mestre de taekwondo<\u002Fspan><span class=\"chip c-pai\">Pai<\u002Fspan><span class=\"chip c-mae opt\">Mãe<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">19:45<br><span style=\"font-size: 14px; font-weight: 700; color: #6E6963;\">seg · qua 20:15<\u002Fspan><\u002Fdiv>\n        <div><p class=\"act\">Jante em família e faça sua tarefa<\u002Fp><p class=\"desc\">Jante com todo mundo junto. Ponha a mesa, regue a planta ou guarde os pratos. Nos dias de taekwondo, o jantar espera você.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><span class=\"chip c-fam\">Família toda<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">21:00<\u002Fdiv>\n        <div><p class=\"act\">Prepare-se para dormir<\u002Fp><p class=\"desc\">Tome banho, vista o pijama, escove os dentes e separe a roupa de amanhã. Depois escute a leitura da mamãe ou do papai.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><span class=\"chip c-mae\">Mãe<\u002Fspan><span class=\"chip c-pai\">Pai<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"time\">22:00<\u002Fdiv>\n        <div><p class=\"act\">Apague a luz e durma<\u002Fp><p class=\"desc\">Durma sempre na mesma hora, até no fim de semana. Das 22h às 9h, seu corpo descansa as 11 horas de que precisa.<\u002Fp><\u002Fdiv>\n        <div class=\"who\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Fim de semana -->\n  <div class=\"block\" style=\"background: #F2F6F3;\">\n    <p class=\"bs\">Fim de semana<\u002Fp>\n    <h2 class=\"bt\" style=\"color: {{accent}};\">Sábado e domingo · passeios e tempo livre<\u002Fh2>\n ct\" style=\"font-size: 16px;\">Veja um filme ou jogue em família<\u002Fp><p class=\"desc\" style=\"font-size: 14px;\">Junte todo mundo no sofá.<\u002Fp>\n            <div class=\"who\" style=\"margin-top: 8px;\"><span class=\"chip c-fam\">Família toda<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"day\">\n        <p class=\"dn\">Domingo<\u002Fp>\n        <div class=\"row\" style=\"grid-template-columns: 80px 1fr; padding: 10px 0;\">\n          <div class=\"time\" style=\"font-size: 18px;\">Manhã<\u002Fdiv>\n          <div><p class=\"act\" style=\"font-size: 16px;\">Aproveite o tempo livre<\u002Fp><p class=\"desc\" style=\"font-size: 14px;\">Nada marcado. Desenhe, brinque, descanse e invente.<\u002Fp>\n            <div class=\"who\" style=\"margin-top: 8px;\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"row\" style=\"grid-template-columns: 80px 1fr; padding: 10px 0;\">\n          <div class=\"time\" style=\"font-size: 18px;\">13:00<\u002Fdiv>\n          <div><p class=\"act\" style=\"font-size: 16px;\">Almoce com a família ou amigos<\u002Fp><p class=\"desc\" style=\"font-size: 14px;\">Encontre os avós, primos ou amigos de fora da escola.<\u002Fp>\n            <div class=\"who\" style=\"margin-top: 8px;\"><span class=\"chip c-fam\">Família toda<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"row\" style=\"grid-template-columns: 80px 1fr; padding: 10px 0;\">\n          <div class=\"time\" style=\"font-size: 18px;\">17:00<\u002Fdiv>\n          <div><p class=\"act\" style=\"font-size: 16px;\">Revise a semana com a mamãe e o papai<\u002Fp><p class=\"desc\" style=\"font-size: 14px;\">Mostre o que aprendeu: os desenhos, a página dos quadrinhos, a pesquisa e as tarefas da escola. Fale em voz alta as palavras novas em inglês e mostre sua sequência de dias.<\u002Fp>\n            <div class=\"who\" style=\"margin-top: 8px;\"><span class=\"chip c-mae\">Mãe<\u002Fspan><span class=\"chip c-pai\">Pai<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"row\" style=\"grid-template-columns: 80px 1fr; padding: 10px 0;\">\n          <div class=\"time\" style=\"font-size: 18px;\">Noite<\u002Fdiv>\n          <div><p class=\"act\" style=\"font-size: 16px;\">Planeje a semana e prepare-se para dormir<\u002Fp><p class=\"desc\" style=\"font-size: 14px;\">Veja com a mamãe e o papai os projetos da manhã da semana que vem. Depois, tome banho e escute a leitura como nos outros dias.<\u002Fp>\n            <div class=\"who\" style=\"margin-top: 8px;\"><span class=\"chip c-mae\">Mãe<\u002Fspan><span class=\"chip c-pai\">Pai<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B5532B&quot;},&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:2280}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { accent: this.props.accent ?? '#B5532B' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
