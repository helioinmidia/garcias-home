<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Saúde">
  <link rel="apple-touch-icon" href="/saude/icon.png">
  <link rel="icon" href="/saude/icon.png">
  <link rel="stylesheet" href="saude.css">
  <title>Acompanhamento Médico</title>
</head>
<body>
  <header class="topo">
    <div class="topo-in">
      <div class="titulo">
        <div>
          <p class="eyebrow" id="hoje">Casa</p>
          <h1>Acompanhamento Médico</h1>
        </div>
        <a href="/">← Casa</a>
      </div>
      <nav class="pessoas" id="pessoas" role="tablist" aria-label="Pessoas"></nav>
      <nav class="secoes" id="secoes" aria-label="Seções"></nav>
    </div>
  </header>

  <main id="pagina">
    <p class="vazio">Carregando…</p>
  </main>

  <p class="rodape">Os dados ficam gravados no servidor da casa e aparecem iguais em todos os aparelhos da rede.
    Esta página só organiza o acompanhamento: siga sempre a receita e as orientações dos médicos.</p>

  <dialog id="dialogo">
    <form method="dialog" id="dialogo-form" novalidate></form>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="app.js" defer></script>
</body>
</html>
